[build]
  base = "frontend"
  # Install the Express backend's dependencies so the API function can bundle it.
  command = "npm install --prefix ../backend && npm run build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  # pdf-parse-new loads pdf.js from files at runtime, so ship it unbundled.
  external_node_modules = ["pdf-parse-new"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
